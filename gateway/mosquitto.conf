# Mosquitto MQTT Broker Configuration for VitalSync Gateway
# Standard TCP Listener for Microcontrollers (ESP32-S2)
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket Listener for Web Dashboard Clients
listener 9001 0.0.0.0
protocol websockets

# Persistence & Logging
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
